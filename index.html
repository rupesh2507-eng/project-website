<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | MM(DU) Mullana</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="navbar">
            <div class="nav-logo border">
                <div class="logo"></div>
            </div>

            <div class="nav-title border">
                <h1>Maharshi Markandeshwar (Deemed To Be) University</h1>
            </div>
        </div>
    </header>
    <main>
        <div class="container">
                <h2>Welcome Back !</h2><br>
                <h3>Login to your Account</h3>

                <form action="dashboard.html">

                    <div class="role">
                        <b>Select Role</b><br>
                        <select>
                            <option value="Select Role" >Select Role</option >
                            <option value="Admin">Admin</option>
                            <option value="Teacher">Teacher</option>
                            <option value="Student">Student</option>
                        </select>
                    </div>
 
                    <div class="email">
                        <b>Email</b><br>
                        <input type="email" placeholder="UserName / Roll No / Admission No">
                    </div>

                    <div class="pass">
                        <b>Password</b><br>
                        <input type="password" placeholder="Password (Default Password is Roll No)">
                    </div>

                    <div class="remember"><label>
                        <pre><input type="checkbox">Remember me            <a href="#">Forgot Password?</a></pre>
                    </div></label>

                    <div class="login">
                        <button type="submit">Login</button>
                    </div>
                </form>
                
                <div class="foot">
                    <p>2026 © ERP 4.0 - By</p>
                <a href="#">MM(DU) MULLANA</a>
                </div>
        </div>
    </main>
</body>
</html>
